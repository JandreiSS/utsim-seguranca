[package]
name = "utsim-seguranca-app"
description = "UTSim Segurança do Trabalho: inventário de riscos por posto, matriz, exposição simulada e relatório (janela nativa)"
version = "0.1.0"
edition.workspace = true
# eframe 0.36 needs Rust 1.95.
rust-version = "1.95"

[[bin]]
name = "utsim-seguranca"
path = "src/main.rs"

[lib]
name = "utsim_seguranca_app"
path = "src/lib.rs"

[dependencies]
utsim-posto.workspace = true
utsim-posto-ui.workspace = true
utsim-seguranca-core.workspace = true
utsim-exposicao.workspace = true
utsim-model.workspace = true
utsim-ui-tema.workspace = true
# Same egui as the other apps, so Cargo.lock keeps one egui. Light: glow renderer only.
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
